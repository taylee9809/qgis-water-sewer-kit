name: "새 함정 · New pitfall"
description: 쓰다가 알게 된 함정 — standard/ 함정 노트에 넣을 것 · A trap you hit that belongs in the pitfall notes
title: "[함정] "
labels: ["pitfall"]
body:
  - type: markdown
    attributes:
      value: |
        회차 수치나 지구명이 아니라 **원리**를 적어 주세요(예: "AC1032 DXF 는 ANSI_949 로 선언돼도 UTF-8").
        Write the principle, not project numbers or place names.
  - type: dropdown
    id: area
    attributes:
      label: 분야 · Area
      options: ["DXF 판독 · reading DXF", "QGIS · PostGIS · GPKG", "수리·설계 판정 · hydraulics & design checks", "파이썬 환경 · Python env", "기타 · other"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무엇이 문제였나 · What went wrong
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: 어떻게 알아챘나 · How you noticed
  - type: textarea
    id: rule
    attributes:
      label: 일반화한 규칙 · The rule to remember
      description: 함정 노트에 한두 줄로 들어갈 문장
    validations:
      required: true
