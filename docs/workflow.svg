<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif" role="img" aria-label="Workflow stages 00 to 80">
