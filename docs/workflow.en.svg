<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 660" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-label="Workflow stages 00 to 80">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="660" rx="12" fill="#ffffff"/>
  <text x="24" y="32" font-size="16" font-weight="700" fill="#24292f">Build the database first — design and review stand on it</text>
  <text x="24" y="50" font-size="12" fill="#57606a">Workflow stages 00–80</text>

  <rect x="24" y="66" width="712" height="176" rx="8" fill="#f6f8fa"/>
