  <text x="100" y="170" text-anchor="middle" font-size="11" fill="#57606a">onboarding</text>
  <rect x="200" y="130" width="140" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="270" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">10 Data intake</text>
  <text x="270" y="170" text-anchor="middle" font-size="11" fill="#57606a">plans · DXF · DEM</text>
