  <text x="100" y="576" text-anchor="middle" font-size="11" fill="#57606a">A3 PDF</text>
  <rect x="180" y="536" width="120" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="240" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">51 Layouts</text>
  <text x="240" y="576" text-anchor="middle" font-size="11" fill="#57606a">QGIS print</text>
  <rect x="320" y="536" width="120" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="380" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">60 Cost</text>
  <text x="380" y="576" text-anchor="middle" font-size="11" fill="#57606a">unit costs</text>
  <rect x="460" y="536" width="120" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="520" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">70 Report</text>
  <text x="520" y="576" text-anchor="middle" font-size="11" fill="#57606a">HWP document</text>
  <rect x="600" y="536" width="120" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.25"/>
  <text x="660" y="558" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">80 Responses</text>
  <text x="660" y="576" text-anchor="middle" font-size="11" fill="#57606a">back to 30</text>

  <rect x="24" y="626" width="28" height="16" rx="4" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="60" y="639" font-size="12" fill="#24292f">stage with a skill</text>
  <line x1="220" y1="634" x2="256" y2="634" stroke="#57606a" stroke-width="1.25" stroke-dasharray="4 4"/>
  <text x="264" y="639" font-size="12" fill="#24292f">feedback loop</text>
