  <text x="150" y="356" text-anchor="middle" font-size="11" fill="#57606a">inverts &amp; hydraulics</text>
  <rect x="75" y="400" width="150" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="150" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">31 Pump stations</text>
  <text x="150" y="440" text-anchor="middle" font-size="11" fill="#57606a">head &amp; power</text>
  <rect x="335" y="316" width="150" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="410" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">32 Optimization</text>
  <text x="410" y="356" text-anchor="middle" font-size="11" fill="#57606a">route alternatives</text>
  <rect x="550" y="316" width="160" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="630" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#24292f">40 Vendor review</text>
  <text x="630" y="356" text-anchor="middle" font-size="11" fill="#57606a">vs as-built DB</text>

  <rect x="40" y="536" width="120" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
