  <text x="450" y="176" text-anchor="middle" font-size="11" fill="#57606a">existing-pipe DB</text>
  <rect x="375" y="190" width="150" height="42" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
