  <text x="640" y="170" text-anchor="middle" font-size="11" fill="#57606a">areas &amp; design flows</text>

  <rect x="50" y="316" width="200" height="52" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
