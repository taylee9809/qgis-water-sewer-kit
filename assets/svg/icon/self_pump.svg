<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1.2 -1.2 2.4 2.4" width="128" height="128">
  <!-- 자가펌프(옥외 배수설비): 파란 동심원 + '자가'/'펌프' 두 줄 (굴림) -->
  <circle cx="0" cy="0" r="1.1" fill="#ffffff" stroke="#0033cc" stroke-width="0.09"/>
  <circle cx="0" cy="0" r="0.9" fill="none" stroke="#0033cc" stroke-width="0.09"/>
  <g fill="#0033cc" font-family="Gulim" font-size="0.44" text-anchor="middle">
    <text x="0" y="-0.06">자가</text>
    <text x="0" y="0.46">펌프</text>
  </g>
</svg>
